<!DOCTYPE html>
<html lang="en">

<head>
    <title>{{title}}</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/post.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>

<body>
    <div class="toplevel">
        <div class="main-container">
            <div class="card">
                <a class="back-button" href="../index.html">
                    <img src="../images/back.png" /> back
                </a>

                <div class="content">
                    {{ content | safe }}
                </div>

                <div class="post-actions">
                    <a href="https://github.com/tedbauer/tedbauer.github.io/edit/main/pages/{{path}}" target="_blank">
                        <img src="../images/pencil.png" /> fix a typo
                    </a>
                    <a href="#" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">
                        <img src="../images/up.png" /> back to top
                    </a>
                </div>
            </div>

            <nav class="toc-sidebar" id="toc-sidebar">
                <h3>On this page</h3>
                <ul id="toc-list"></ul>
            </nav>
        </div>
    </div>

    <script>
        hljs.highlightAll();

        // Build table of contents from h2 headings
        (function() {
            const content = document.querySelector('.content');
            const tocList = document.getElementById('toc-list');
            const headings = content.querySelectorAll('h2');

            headings.forEach(function(heading, i) {
                const id = 'section-' + i;
                heading.id = id;

                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = '#' + id;
                a.textContent = heading.textContent;
                a.addEventListener('click', function(e) {
                    e.preventDefault();
                    heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
                li.appendChild(a);
                tocList.appendChild(li);
            });

            // Scroll spy for active TOC item
            const tocLinks = tocList.querySelectorAll('a');
            function updateActive() {
                let current = '';
                headings.forEach(function(heading) {
                    if (heading.getBoundingClientRect().top <= 80) {
                        current = heading.id;
                    }
                });
                tocLinks.forEach(function(link) {
                    link.classList.toggle('active', link.getAttribute('href') === '#' + current);
                });
            }

            window.addEventListener('scroll', function() {
                updateActive();
            }, { passive: true });
            updateActive();
            // Make content images clickable to open full-size
            content.querySelectorAll('img').forEach(function(img) {
                img.addEventListener('click', function() {
                    window.open(img.src, '_blank');
                });
            });
        })();
    </script>
</body>

</html>
